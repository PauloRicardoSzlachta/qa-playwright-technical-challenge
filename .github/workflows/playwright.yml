name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30 # Aumentado para 30min para garantir os 2 browsers
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm' # Essencial para velocidade em execuções futuras

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      # Instalado exatamente o que o config pede (Chromium e Firefox)
      run: npx playwright install chromium firefox --with-deps

    - name: Run Playwright tests
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
      # O segredo da velocidade: rodar com workers em paralelo
      run: npx playwright test --workers=3

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7